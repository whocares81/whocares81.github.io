<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="player" class="player is-paused" tabindex="0" aria-label="Video player">

  <video
    id="video"
    class="video"
    playsinline
    webkit-playsinline
    preload="metadata"
    aria-label="Video content"
  ></video>

  <div id="loadingIndicator" class="loading-indicator" aria-hidden="true">
    <div class="spinner"></div>
  </div>

  <div id="bufferingIndicator" class="buffering-indicator" aria-hidden="true">
    <div class="spinner"></div>
  </div>

  <div class="gesture-layer" id="gestureLayer">
    <div class="seek-flash seek-flash--left" id="seekFlashLeft" aria-hidden="true">
      <div class="seek-flash__content">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M11.5 12l8.5 6V6zM2 12l8.5 6V6z"/></svg>
        <span class="seek-flash__label">10 seconds</span>
      </div>
    </div>
    <div class="seek-flash seek-flash--right" id="seekFlashRight" aria-hidden="true">
      <div class="seek-flash__content">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12.5 12L4 18V6zM22 12l-8.5 6V6z"/></svg>
        <span class="seek-flash__label">10 seconds</span>
      </div>
    </div>
  </div>

  <div id="errorState" class="error-state" role="alert" aria-live="assertive" hidden>
    <p class="error-state__message">Something went wrong.</p>
    <button id="retryBtn" class="error-state__retry" type="button">Retry</button>
  </div>

  <div id="controls" class="controls">

    <div class="controls__dim" aria-hidden="true"></div>
    <div class="controls__scrim controls__scrim--top" aria-hidden="true"></div>
    <div class="controls__scrim controls__scrim--bottom" aria-hidden="true"></div>

    <div class="center-controls">
      <button id="seekBackBtn" class="center-btn center-btn--seek" type="button" aria-label="Rewind 10 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><text x="12" y="15.4" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" stroke="none" font-family="inherit">10</text></svg>
      </button>

      <button id="bigPlayBtn" class="center-btn big-play-btn" type="button" aria-label="Play">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.5 5.6v12.8c0 1.1 1.2 1.8 2.2 1.2l10.1-6.4a1.4 1.4 0 0 0 0-2.4L9.7 4.4c-1-.6-2.2.1-2.2 1.2z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><rect x="5.5" y="4.5" width="4.5" height="15" rx="2"/><rect x="14" y="4.5" width="4.5" height="15" rx="2"/></svg>
      </button>

      <button id="seekFwdBtn" class="center-btn center-btn--seek" type="button" aria-label="Forward 10 seconds">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><text x="12" y="15.4" text-anchor="middle" font-size="7" font-weight="700" fill="currentColor" stroke="none" font-family="inherit">10</text></svg>
      </button>
    </div>

    <div class="controls__bottom">
      <div class="progress-row">
        <div
          id="progressBar"
          class="progress-bar"
          role="slider"
          aria-label="Seek"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          tabindex="0"
        >
          <div class="progress-bar__track">
            <div id="bufferedFill" class="progress-bar__buffered"></div>
            <div id="hoverFill" class="progress-bar__hover"></div>
            <div id="playedFill" class="progress-bar__played"></div>
          </div>
          <div id="progressHandle" class="progress-bar__handle"></div>
          <div id="hoverTime" class="progress-bar__preview" aria-hidden="true">00:00</div>
        </div>
      </div>

      <div class="controls__row">
        <div class="controls__group controls__group--left">
          <button id="playPauseBtn" class="ctrl-btn ctrl-btn--play" type="button" aria-label="Play">
            <svg class="icon icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7.5 5.6v12.8c0 1.1 1.2 1.8 2.2 1.2l10.1-6.4a1.4 1.4 0 0 0 0-2.4L9.7 4.4c-1-.6-2.2.1-2.2 1.2z"/></svg>
            <svg class="icon icon-pause" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="5.5" y="4.5" width="4.5" height="15" rx="2"/><rect x="14" y="4.5" width="4.5" height="15" rx="2"/></svg>
          </button>

          <div class="volume-group" id="volumeGroup">
            <button id="muteBtn" class="ctrl-btn" type="button" aria-label="Mute" data-level="high">
              <svg class="icon icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="vol-speaker" d="M4 9.5h2.8L11 6v12l-4.2-3.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z" fill="currentColor"/><path class="vol-wave vol-wave--1" d="M14.5 9.5a3.5 3.5 0 0 1 0 5"/><path class="vol-wave vol-wave--2" d="M17.5 6.5a7.5 7.5 0 0 1 0 11"/><g class="vol-cross"><path d="m15 9.5 5 5"/><path d="m20 9.5-5 5"/></g></svg>
            </button>
            <div class="volume-slider" id="volumeSlider" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" tabindex="0">
              <div class="volume-slider__track">
                <div id="volumeFill" class="volume-slider__fill"></div>
                <div id="volumeHandle" class="volume-slider__handle"></div>
              </div>
            </div>
          </div>

          <div class="time-display" id="timeDisplay">
            <span id="currentTime">00:00</span>
            <span class="time-display__sep">/</span>
            <span id="duration" class="time-display__duration">00:00</span>
          </div>
        </div>

        <div class="controls__group controls__group--right">
          <button id="settingsBtn" class="ctrl-btn" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.49.49 0 0 0-.5-.42h-3.84a.49.49 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.24.1.46 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
          </button>

          <button id="pipBtn" class="ctrl-btn" type="button" aria-label="Picture in picture" hidden>
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
          </button>

          <button id="fullscreenBtn" class="ctrl-btn" type="button" aria-label="Fullscreen">
            <svg class="icon icon-fs-enter" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            <svg class="icon icon-fs-exit" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div id="settingsBackdrop" class="settings-backdrop" hidden></div>

    <div id="settingsMenu" class="settings-menu" role="menu" hidden>
      <div class="settings-menu__grabber" aria-hidden="true"></div>

      <div id="settingsRoot" class="settings-menu__panel" data-panel="root">
        <button class="settings-menu__item" type="button" data-target="speed" role="menuitem">
          <span class="settings-menu__label">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 3.35 19a2 2 0 0 0 1.72 1h13.85a2 2 0 0 0 1.74-1 10 10 0 0 0-.27-10.44zm-9.79 6.84a2 2 0 0 0 2.83 0l5.66-8.49-8.49 5.66a2 2 0 0 0 0 2.83z"/></svg>
            Playback speed
          </span>
          <span class="settings-menu__value" id="speedValueLabel">Normal</span>
        </button>
        <button class="settings-menu__item" type="button" data-target="quality" id="qualityMenuItem" role="menuitem" hidden>
          <span class="settings-menu__label">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
            Quality
          </span>
          <span class="settings-menu__value" id="qualityValueLabel">Auto</span>
        </button>
      </div>

      <div class="settings-menu__panel" data-panel="speed" hidden>
        <button class="settings-menu__back" type="button" data-back>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
          Playback speed
        </button>
        <div id="speedOptions" class="settings-menu__options"></div>
      </div>

      <div class="settings-menu__panel" data-panel="quality" hidden>
        <button class="settings-menu__back" type="button" data-back>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
          Quality
        </button>
        <div id="qualityOptions" class="settings-menu__options"></div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
